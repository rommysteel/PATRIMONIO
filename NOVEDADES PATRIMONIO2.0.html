<script>
// =========================
// Fecha y hora actual
// =========================
const ahora = new Date();
document.getElementById("fechaHoraRegistro").value = ahora.toLocaleString();

// =========================
// Día de la semana
// =========================
function calcularDia(){
    const fechaVal = document.getElementById("fechaEvento").value;
    if (!fechaVal) { document.getElementById("diaSemana").value = ""; return; }
    // Usar getDay con una fecha local segura
    const fecha = new Date(fechaVal + "T12:00:00"); // evita problemas de zona horaria en móviles
    const dias = ["Domingo","Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"];
    document.getElementById("diaSemana").value = dias[fecha.getDay()];
}

// =======================================================
// Coordenadas automáticas (robusto para móviles)
// - Intenta al cargar
// - Reintenta con gesto del usuario (tap/click)
// - Fallback: watchPosition si getCurrentPosition falla
// =======================================================
function setCoords(lat, lon){
    document.getElementById("latitud").value = lat ?? "";
    document.getElementById("longitud").value = lon ?? "";
}

function solicitarUbicacion(useWatchFallback = true){
    if (!("geolocation" in navigator)) {
        console.warn("Geolocalización no disponible en este navegador");
        setCoords("", "");
        return;
    }

    const options = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 };

    navigator.geolocation.getCurrentPosition(
        (pos) => setCoords(pos.coords.latitude, pos.coords.longitude),
        (err) => {
            console.warn("getCurrentPosition error:", err?.code, err?.message);
            if (useWatchFallback) {
                // Fallback: intentar watchPosition (a veces funciona mejor en móviles)
                const watchId = navigator.geolocation.watchPosition(
                    (pos2) => {
                        setCoords(pos2.coords.latitude, pos2.coords.longitude);
                        navigator.geolocation.clearWatch(watchId);
                    },
                    (err2) => {
                        console.warn("watchPosition error:", err2?.code, err2?.message);
                        setCoords("", "");
                    },
                    options
                );
            } else {
                setCoords("", "");
            }
        },
        options
    );
}

// Intento al cargar (requiere HTTPS para que el permiso se muestre)
window.addEventListener("load", () => {
    solicitarUbicacion(true);
});

// Reintento tras primer interacción del usuario (necesario en iOS/Safari)
let reintentoHecho = false;
["click","touchstart"].forEach(evt => {
    window.addEventListener(evt, () => {
        if (!reintentoHecho && (!document.getElementById("latitud").value || !document.getElementById("longitud").value)) {
            reintentoHecho = true;
            solicitarUbicacion(true);
        }
    }, { once: true });
});

// ==================================================================
// Integración con Power Automate + Excel en línea (sin cambios funcionales)
// ==================================================================
document.getElementById("eventoForm").addEventListener("submit", async function(e){
    e.preventDefault();

    const data = {
        funcionario: document.getElementById("funcionario").value,
        consecutivo: document.getElementById("consecutivo").value,
        fechaHoraRegistro: document.getElementById("fechaHoraRegistro").value,

        fechaEvento: document.getElementById("fechaEvento").value,
        diaSemana: document.getElementById("diaSemana").value,
        horaEvento: document.getElementById("horaEvento").value,
        municipio: document.getElementById("municipio").value,
        estacion: document.getElementById("estacion").value,
        zona: document.getElementById("zona").value,
        zonaAtencion: document.getElementById("zonaAtencion").value,
        barrio: document.getElementById("barrio").value,
        direccion: document.getElementById("direccion").value,

        latitud: document.getElementById("latitud").value,
        longitud: document.getElementById("longitud").value,

        grupo: document.getElementById("grupo").value,
        evento: document.getElementById("evento").value,
        modalidad: document.getElementById("modalidad").value,
        arma: document.getElementById("arma").value,
        elemento: document.getElementById("elemento").value,
        marca: document.getElementById("marca").value,
        linea: document.getElementById("linea").value,
        placa: document.getElementById("placa").value,

        victima: document.getElementById("victima").value,
        cedula: document.getElementById("cedula").value,
        numero: document.getElementById("numero").value,
        celular: document.getElementById("celular").value,
        correo: document.getElementById("correo").value,
        genero: document.getElementById("genero").value,

        hechos: document.getElementById("hechos").value,
        nunc: document.getElementById("nunc").value,
        videosRecolecto: document.getElementById("videosRecolecto").value,
        videosPreservacion: document.getElementById("videosPreservacion").value,
        entrevistas: document.getElementById("entrevistas").value,
        cdr: document.getElementById("cdr").value,
        observaciones: document.getElementById("observaciones").value
    };

    try {
        const res = await fetch("https://default6ced28707308471eaf1561b2f796b4.9c.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/e5445798d851485f8ff3f2b276b6cc8b/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=04doCcvBYpVRZHSGgyHVw1FYt6MTkltTn8olxtYqths", {
            method: "POST",
            headers: { "Content-Type":"application/json" },
            body: JSON.stringify(data)
        });

        if (!res.ok) throw new Error("Respuesta no OK del flujo");
        alert("Formulario enviado correctamente");
        // this.reset(); // opcional
        document.getElementById("eventoForm").reset(); // Limpia el formulario
        document.getElementById("fechaHoraRegistro").value = (new Date()).toLocaleString(); //

    } catch (err) {
        console.error(err);
        alert("Error al enviar");
    }
});
</script>
