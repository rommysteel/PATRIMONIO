<script>





  const MAX_SIZE = 5 * 1024 * 1024;

  // Previsualización (igual que en tu código)
  function previewImage(inputId, imgId) {
    document.getElementById(inputId).addEventListener("change", e => {
      const file = e.target.files[0];
      const img = document.getElementById(imgId);
      if (file) {
        if (!file.type.startsWith("image/")) {
          alert("Debe ser una imagen.");
          e.target.value = "";
          img.style.display = "none";
          return;
        }
        if (file.size > MAX_SIZE) {
          alert("La imagen supera 5MB.");
          e.target.value = "";
          img.style.display = "none";
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          img.src = reader.result;
          img.style.display = "block";
        };
        reader.readAsDataURL(file);
      }
    });
  }

  ["fotoLateralIzquierda","fotoLateralDerecha","fotoFrontal","fotoPosterior","fotoTacometro"]
    .forEach((id, i) => previewImage(id, ["previewIzq","previewDer","previewFront","previewPost","previewTaco"][i]));

  // ÚNICO submit handler
  document.getElementById("photoForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const status = document.getElementById("status");
    status.textContent = "⏳ Enviando datos y fotos...";

    // 1) Recoger datos del formulario
    const data = {
      fecha: document.getElementById('fecha').value,
      hora: document.getElementById('hora').value,
      moto: document.getElementById('moto').value,
      sigla: document.getElementById('sigla').value,
      asignado: document.getElementById('asignado').value,
      correo: document.getElementById('correo').value,
      estado: document.getElementById('estado').value,
      funcionario: document.getElementById('funcionario').value,
      correoFuncionario: document.getElementById('correoFuncionario').value,
      compania: document.getElementById('compania').value,
      servicio: document.getElementById('servicio').value,
      horaInicio: document.getElementById('horaInicio').value,
      horaFin: document.getElementById('horaFin').value,
      observaciones: document.getElementById('observaciones').value
    };

    // Validaciones mínimas
    if (!data.moto || !data.funcionario || !data.servicio) {
      alert("Por favor complete los campos obligatorios.");
      status.textContent = "";
      return;
    }

    // 2) Recoger fotos como Base64 (contenido sin prefijo data:)
    const toBase64 = file => new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]); // quitar 'data:image/...;base64,'
      reader.onerror = () => reject("Error leyendo archivo");
      reader.readAsDataURL(file);
    });

    const fotoIds = ["fotoLateralIzquierda","fotoLateralDerecha","fotoFrontal","fotoPosterior","fotoTacometro"];
    const fotos = {};

    for (const id of fotoIds) {
      const file = document.getElementById(id).files[0];
      if (!file) {
        status.textContent = "⚠️ Falta una foto: " + id;
        return;
      }
      const base64 = await toBase64(file);
      fotos[id] = {
        nombreFoto: file.name,
        tipoFoto: file.type,
        tamanoFoto: file.size,
        contenidoFoto: base64
      };
    }

    // 3) Armar payload único
    const payload = {
      ...data,
      fotografiasVehiculo: fotos
    };

    // 4) Enviar a Power Automate (un solo POST)
    const urlFlujo = "https://default6ced28707308471eaf1561b2f796b4.9c.environment.api.powerplatform.com/powerautomate/automations/direct/workflows/068de64125ef4ac8946d7624e2f205b3/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=WtKp8BFri2n_gYzwG04pMLE7tCa9yyBG3Rrf8ROaGBc";

    try {
      const response = await fetch(urlFlujo, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify(payload)
      });

      if (response.ok) {
        alert("✅ Formulario y fotos enviados correctamente.");
        document.getElementById('photoForm').reset(); // ID correcto
        status.textContent = "";
        // Ocultar previews
        ["previewIzq","previewDer","previewFront","previewPost","previewTaco"].forEach(id => {
          const img = document.getElementById(id);
          img.removeAttribute("src");
          img.style.display = "none";
        });
      } else {
        const text = await response.text();
        status.textContent = "❌ Error al enviar: " + text;
      }
    } catch (error) {
      console.error(error);
      status.textContent = "❌ Error de conexión: " + error;
    }
  });

</script>
